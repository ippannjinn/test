[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextai-platform"
version = "1.7.1"
description = "Self-hosted multi-user multimodal AI platform (server)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.34,<0.35",
  "pydantic>=2.11,<3",
  "argon2-cffi>=23.1",
  "psutil>=7.0",
  "httpx>=0.28,<0.29",
  "python-multipart>=0.0.20",
  "cryptography>=44",
  "nvidia-ml-py>=12.575",
  "wasmtime>=32,<33",
  "pypdf>=5.5",
  "pillow>=11.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.26"]

[project.scripts]
nextai = "nextai.cli:main"

[tool.setuptools.packages.find]
include = ["nextai*"]

[tool.setuptools.package-data]
nextai = ["migrations/*.sql", "catalog/*.json", "web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
